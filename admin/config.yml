backend:
  name: github
  repo: artemasovvalera/yasam
  branch: main
  base_url: https://decapcms-oauth.onrender.com

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Страницы"
    files:
      - label: "Главная страница"
        name: "index"
        file: "index.html"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }
          - { label: "Описание", name: "description", widget: "text" }
          - { label: "Содержимое", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Настройки"
    files:
      - label: "Общие"
        name: "general"
        file: "site-config.json"
        fields:
          - { label: "Название сайта", name: "site_name", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Телефон", name: "phone", widget: "string" }
